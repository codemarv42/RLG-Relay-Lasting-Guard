; RLG OS - PlatformIO project
; The sources live in RLG_OS/ so the same folder also opens in the Arduino IDE.

[platformio]
src_dir = RLG_OS

[env:rlg-master]
platform = espressif32@^6.8.0     ; Arduino-ESP32 core 2.0.17 (release build verified with 2.0.17)
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@2.3.7
    milesburton/DallasTemperature@3.9.0
    madhephaestus/ESP32Encoder@0.10.2
    adafruit/Adafruit GFX Library@1.11.9
    adafruit/Adafruit SH110X@2.1.10
